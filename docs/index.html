<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ข้อมูลงบการเงินหุ้นไทย (SET)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="config.js"></script>
<style>
  :root{
    --bg:#0f1720; --panel:#161f2b; --panel2:#1c2634; --border:#28323f;
    --text:#e8edf3; --muted:#8ea0b3; --accent:#3ea6ff; --good:#3ecf8e; --bad:#ff6b6b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Prompt',sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh;
  }
  header{
    padding:28px 20px 18px; text-align:center; border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#131c27,#0f1720);
  }
  header h1{margin:0 0 4px; font-size:22px; font-weight:600;}
  header p{margin:0; color:var(--muted); font-size:13px;}
  .search-wrap{
    max-width:520px; margin:22px auto 0; padding:0 16px; display:flex; gap:8px;
  }
  #tickerInput{
    flex:1; padding:14px 16px; border-radius:10px; border:1px solid var(--border);
    background:var(--panel); color:var(--text); font-size:16px; font-family:inherit;
    outline:none;
  }
  #tickerInput:focus{border-color:var(--accent);}
  #searchBtn{
    padding:14px 20px; border-radius:10px; border:none; background:var(--accent);
    color:#04121f; font-weight:600; font-size:15px; cursor:pointer;
  }
  #searchBtn:disabled{opacity:.6; cursor:default;}
  .hint{max-width:520px; margin:8px auto 0; padding:0 16px; color:var(--muted); font-size:12px; text-align:center;}
  main{max-width:920px; margin:0 auto; padding:20px 16px 60px;}
  #status{text-align:center; color:var(--muted); font-size:14px; margin:24px 0; min-height:20px;}
  .spinner{
    width:22px; height:22px; border:3px solid var(--border); border-top-color:var(--accent);
    border-radius:50%; display:inline-block; vertical-align:middle; margin-right:8px;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .company-header{margin:18px 0 6px;}
  .company-header h2{margin:0; font-size:20px;}
  .company-header span{color:var(--muted); font-size:13px;}
  .tabs{display:flex; gap:8px; margin:14px 0;}
  .tab{
    padding:8px 16px; border-radius:8px; background:var(--panel); border:1px solid var(--border);
    color:var(--muted); cursor:pointer; font-size:14px; font-family:inherit;
  }
  .tab.active{background:var(--accent); color:#04121f; border-color:var(--accent); font-weight:600;}
  .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:12px; margin-top:8px;}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px 16px;
  }
  .card .label{font-size:12px; color:var(--muted); margin-bottom:6px;}
  .card .value{font-size:19px; font-weight:600;}
  .card .value.good{color:var(--good);}
  .card .value.bad{color:var(--bad);}
  .section-title{margin:26px 0 4px; font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;}
  .chart-box{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; margin-top:24px;}
  footer{text-align:center; color:var(--muted); font-size:12px; padding:20px; border-top:1px solid var(--border);}
  .error-box{
    max-width:520px; margin:20px auto; padding:14px 16px; border-radius:10px;
    background:#2a1616; border:1px solid #4a2323; color:#ff9b9b; font-size:14px; text-align:center;
  }
</style>
</head>
<body>

<header>
  <h1>📊 ข้อมูลงบการเงินหุ้นไทย (SET)</h1>
  <p>พิมพ์ ticker ของหุ้นในตลาด SET เพื่อดูสถานะหนี้สิน กระแสเงินสด และความสามารถในการทำกำไร</p>
</header>

<div class="search-wrap">
  <input id="tickerInput" type="text" placeholder="เช่น PTT, AOT, CPALL, KBANK ..." autocomplete="off" />
  <button id="searchBtn">ค้นหา</button>
</div>
<div class="hint">ไม่ต้องพิมพ์ .BK ระบบเติมให้อัตโนมัติ · ข้อมูลอัปเดตอัตโนมัติทุกวัน</div>

<main>
  <div id="status"></div>
  <div id="result"></div>
</main>

<footer>
  ข้อมูลจาก Yahoo Finance ผ่าน yfinance · ใช้เพื่อการศึกษาเท่านั้น ไม่ใช่คำแนะนำการลงทุน
</footer>

<script>
const cfg = window.APP_CONFIG;
const sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

const els = {
  input: document.getElementById('tickerInput'),
  btn: document.getElementById('searchBtn'),
  status: document.getElementById('status'),
  result: document.getElementById('result'),
};

let currentTab = 'annual';
let currentRows = [];
let pollTimer = null;

function normalizeTicker(raw){
  let t = (raw || '').trim().toUpperCase();
  if (t && !t.includes('.')) t = t + '.BK';
  return t;
}

function fmtNum(v, opts={}){
  if (v === null || v === undefined || Number.isNaN(v)) return '—';
  const { pct=false, ratio=false, money=true } = opts;
  if (pct) return v.toFixed(2) + '%';
  if (ratio) return v.toFixed(2) + ' เท่า';
  if (money){
    const abs = Math.abs(v);
    if (abs >= 1e9) return (v/1e9).toFixed(2) + ' พันล้าน';
    if (abs >= 1e6) return (v/1e6).toFixed(2) + ' ล้าน';
    return v.toLocaleString('en-US', {maximumFractionDigits:2});
  }
  return v;
}

function colorClass(v, goodIfHigh=true){
  if (v === null || v === undefined) return '';
  if (goodIfHigh) return v >= 0 ? 'good' : 'bad';
  return v <= 1 ? 'good' : 'bad';
}

const METRIC_DEFS = [
  { key:'total_liabilities', label:'1. หนี้สินรวม', fmt:{money:true} },
  { key:'interest_bearing_debt', label:'2. หนี้สินที่มีภาระดอกเบี้ย', fmt:{money:true} },
  { key:'de_ratio', label:'3. หนี้สิน/ทุน (D/E)', fmt:{ratio:true}, badHigh:true },
  { key:'net_debt_to_ebitda', label:'4. Net Debt / EBITDA', fmt:{ratio:true}, badHigh:true },
  { key:'ebitda', label:'5. EBITDA', fmt:{money:true}, goodHigh:true },
  { key:'ebit', label:'6. กำไรก่อนดอกเบี้ย (EBIT)', fmt:{money:true}, goodHigh:true },
  { key:'interest_expense', label:'7. ดอกเบี้ยจ่าย', fmt:{money:true} },
  { key:'interest_coverage_ratio', label:'8. Interest Coverage Ratio', fmt:{ratio:true}, goodHigh:true },
  { key:'cfo', label:'9. กระแสเงินสดจากการดำเนินงาน (CFO)', fmt:{money:true}, goodHigh:true },
  { key:'fcf', label:'10. Free Cash Flow (FCF)', fmt:{money:true}, goodHigh:true },
  { key:'cash_and_equivalents', label:'11. เงินสดและรายการเทียบเท่าเงินสด', fmt:{money:true} },
  { key:'current_ratio', label:'12. Current Ratio', fmt:{ratio:true}, goodHigh:true },
  { key:'net_income', label:'13. กำไรสุทธิ', fmt:{money:true}, goodHigh:true },
  { key:'roe', label:'14. ROE', fmt:{pct:true}, goodHigh:true },
  { key:'roa', label:'14. ROA', fmt:{pct:true}, goodHigh:true },
  { key:'revenue_growth', label:'15. การเติบโตของรายได้', fmt:{pct:true}, goodHigh:true },
  { key:'earnings_growth', label:'16. การเติบโตของกำไร', fmt:{pct:true}, goodHigh:true },
];

function renderMetrics(row){
  const cards = METRIC_DEFS.map(def => {
    const v = row[def.key];
    let cls = '';
    if (def.goodHigh) cls = colorClass(v, true);
    if (def.badHigh) cls = colorClass(v, false); // จริงๆ ใช้เกณฑ์คงที่ด้านล่างแทน
    if (def.key === 'de_ratio') cls = (v!==null && v<=1.5) ? 'good' : (v!==null? 'bad':'');
    if (def.key === 'net_debt_to_ebitda') cls = (v!==null && v<=3) ? 'good' : (v!==null? 'bad':'');
    if (def.key === 'current_ratio') cls = (v!==null && v>=1) ? 'good' : (v!==null? 'bad':'');
    if (def.key === 'interest_coverage_ratio') cls = (v!==null && v>=3) ? 'good' : (v!==null? 'bad':'');
    return `<div class="card">
      <div class="label">${def.label}</div>
      <div class="value ${cls}">${fmtNum(v, def.fmt)}</div>
    </div>`;
  }).join('');
  return `<div class="grid">${cards}</div>`;
}

function renderTabs(){
  const hasAnnual = currentRows.some(r=>r.period_type==='annual');
  const hasQ = currentRows.some(r=>r.period_type==='quarterly');
  return `<div class="tabs">
    ${hasAnnual? `<button class="tab ${currentTab==='annual'?'active':''}" data-tab="annual">ปีล่าสุด (Annual)</button>`:''}
    ${hasQ? `<button class="tab ${currentTab==='quarterly'?'active':''}" data-tab="quarterly">ไตรมาสล่าสุด (Quarterly)</button>`:''}
  </div>`;
}

function renderAll(companyName, ticker){
  const row = currentRows.find(r => r.period_type === currentTab) || currentRows[0];
  if (!row){ els.result.innerHTML=''; return; }
  els.result.innerHTML = `
    <div class="company-header">
      <h2>${companyName || ticker} <span>(${ticker})</span></h2>
      <span>งวดบัญชี: ${row.fiscal_label || row.period_end || '-'} · อัปเดตล่าสุด: ${new Date(row.updated_at).toLocaleString('th-TH')}</span>
    </div>
    ${renderTabs()}
    ${renderMetrics(row)}
    <div class="section-title">แนวโน้มรายได้ &amp; กำไรสุทธิ (ย้อนหลัง)</div>
    <div class="chart-box"><canvas id="trendChart" height="110"></canvas></div>
  `;
  document.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentTab = btn.dataset.tab; renderAll(companyName, ticker); });
  });
  drawTrendChart(ticker);
}

async function drawTrendChart(ticker){
  const { data } = await sb.from('financials')
    .select('fiscal_label, revenue, net_income, period_end')
    .eq('ticker', ticker)
    .eq('period_type', currentTab)
    .order('period_end', { ascending:true })
    .limit(8);
  if (!data || data.length===0) return;
  const ctx = document.getElementById('trendChart');
  if (!ctx) return;
  new Chart(ctx, {
    type:'bar',
    data:{
      labels: data.map(d=>d.fiscal_label),
      datasets:[
        { label:'รายได้', data:data.map(d=>d.revenue), backgroundColor:'#3ea6ff' },
        { label:'กำไรสุทธิ', data:data.map(d=>d.net_income), backgroundColor:'#3ecf8e' },
      ]
    },
    options:{
      responsive:true,
      plugins:{ legend:{ labels:{ color:'#e8edf3' } } },
      scales:{
        x:{ ticks:{ color:'#8ea0b3' }, grid:{ color:'#28323f' } },
        y:{ ticks:{ color:'#8ea0b3' }, grid:{ color:'#28323f' } },
      }
    }
  });
}

async function search(){
  const raw = els.input.value;
  const ticker = normalizeTicker(raw);
  if (!ticker || ticker.length < 4){
    els.status.innerHTML = '<div class="error-box">กรุณาพิมพ์ชื่อหุ้นก่อนค้นหา</div>';
    return;
  }
  clearTimeout(pollTimer);
  els.btn.disabled = true;
  els.result.innerHTML = '';
  els.status.innerHTML = `<span class="spinner"></span> กำลังค้นหา ${ticker} ...`;

  const { data, error } = await sb.from('financials').select('*').eq('ticker', ticker);

  if (error){
    els.status.innerHTML = `<div class="error-box">เกิดข้อผิดพลาด: ${error.message}</div>`;
    els.btn.disabled = false;
    return;
  }

  if (data && data.length > 0){
    currentRows = data;
    currentTab = data.some(r=>r.period_type==='annual') ? 'annual' : 'quarterly';
    els.status.innerHTML = '';
    renderAll(data[0].company_name, ticker);
    els.btn.disabled = false;
    return;
  }

  // ไม่พบข้อมูล -> สั่งให้ระบบไปดึงข้อมูลทันที แล้วรอผล
  els.status.innerHTML = `<span class="spinner"></span> ยังไม่มีข้อมูลของ ${ticker} กำลังสั่งดึงข้อมูลใหม่ (ใช้เวลาประมาณ 1-2 นาที) ...`;
  try{
    await fetch(cfg.TRIGGER_FUNCTION_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization': `Bearer ${cfg.SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ ticker })
    });
  }catch(e){ /* จะลอง poll ต่อแม้ trigger จะ error เผื่อ workflow ถูกรันจากที่อื่นไปแล้ว */ }

  pollForResult(ticker, 0);
}

async function pollForResult(ticker, attempt){
  if (attempt > 24){ // ~2 นาที (24 x 5 วิ)
    els.status.innerHTML = `<div class="error-box">ยังดึงข้อมูลไม่สำเร็จภายในเวลาที่กำหนด ลองกดค้นหาอีกครั้งในอีกสักครู่ หรือตรวจสอบว่าพิมพ์ ticker ถูกต้องหรือไม่</div>`;
    els.btn.disabled = false;
    return;
  }
  const { data } = await sb.from('financials').select('*').eq('ticker', ticker);
  if (data && data.length > 0){
    currentRows = data;
    currentTab = data.some(r=>r.period_type==='annual') ? 'annual' : 'quarterly';
    els.status.innerHTML = '';
    renderAll(data[0].company_name, ticker);
    els.btn.disabled = false;
    return;
  }
  pollTimer = setTimeout(()=>pollForResult(ticker, attempt+1), 5000);
}

els.btn.addEventListener('click', search);
els.input.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
</script>

</body>
</html>

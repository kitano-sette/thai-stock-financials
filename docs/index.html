<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ข้อมูลงบการเงินหุ้นไทย (SET)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{
    --bg:#faf5ea; --panel:#ffffff; --border:#e9dfc8;
    --text:#3c2c1e; --muted:#8a7358;
    --brown-dark:#4a2f22; --brown-mid:#6e4430;
    --gold:#d1a02c; --gold-light:#f3c93a; --gold-bg:#fff2c2;
    --good:#2e7d46; --bad:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Prompt',sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh;
  }
  header{
    padding:34px 20px 26px; text-align:center;
    background:linear-gradient(135deg,var(--brown-dark),var(--brown-mid) 60%, #8a5a3a);
    box-shadow:0 4px 18px rgba(74,47,34,0.25);
  }
  header h1{margin:0 0 6px; font-size:23px; font-weight:700; color:#fff;}
  header p{margin:0; color:#e8d9c2; font-size:13px;}
  .search-wrap{
    max-width:520px; margin:-22px auto 0; padding:0 16px; display:flex; gap:8px; position:relative; z-index:2;
  }
  #tickerInput{
    flex:1; padding:15px 18px; border-radius:12px; border:1px solid var(--border);
    background:var(--panel); color:var(--text); font-size:16px; font-family:inherit;
    outline:none; box-shadow:0 6px 16px rgba(74,47,34,0.15);
  }
  #tickerInput:focus{border-color:var(--gold);}
  #searchBtn{
    padding:15px 22px; border-radius:12px; border:none;
    background:linear-gradient(135deg,var(--gold-light),var(--gold));
    color:#4a2f16; font-weight:700; font-size:15px; cursor:pointer;
    box-shadow:0 6px 16px rgba(209,160,44,0.35);
  }
  #searchBtn:disabled{opacity:.6; cursor:default;}
  main{max-width:940px; margin:0 auto; padding:32px 16px 60px;}
  #status{text-align:center; color:var(--muted); font-size:14px; margin:24px 0; min-height:20px;}
  .spinner{
    width:22px; height:22px; border:3px solid var(--border); border-top-color:var(--gold);
    border-radius:50%; display:inline-block; vertical-align:middle; margin-right:8px;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .company-header{
    margin:8px 0 6px; background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:18px 22px; box-shadow:0 3px 10px rgba(74,47,34,0.06);
  }
  .company-header h2{margin:0; font-size:21px; color:var(--brown-dark);}
  .company-header h2 span{color:var(--muted); font-weight:400; font-size:15px;}
  .company-header .updated{color:var(--muted); font-size:12px; margin-top:4px; display:block;}
  .tabs{display:flex; gap:10px; margin:18px 0 6px; flex-wrap:wrap;}
  .tab{
    padding:10px 18px; border-radius:10px; background:var(--panel); border:1px solid var(--border);
    color:var(--brown-mid); cursor:pointer; font-size:14px; font-family:inherit; font-weight:500;
  }
  .tab.active{
    background:linear-gradient(135deg,var(--gold-light),var(--gold));
    color:#4a2f16; border-color:var(--gold); font-weight:700;
  }
  .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:14px; margin-top:14px;}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px 18px;
    box-shadow:0 3px 10px rgba(74,47,34,0.05);
  }
  .card .label{font-size:12.5px; color:var(--muted); margin-bottom:8px; font-weight:500;}
  .card .value{font-size:20px; font-weight:700; color:var(--brown-dark);}
  .card .value.good{color:var(--good);}
  .card .value.bad{color:var(--bad);}
  .card .value.highlight{
    display:inline-block; background:var(--gold-bg); padding:3px 10px; border-radius:8px;
  }
  footer{text-align:center; color:var(--muted); font-size:12px; padding:26px 20px; border-top:1px solid var(--border); margin-top:20px;}
  .error-box{
    max-width:520px; margin:20px auto; padding:14px 16px; border-radius:10px;
    background:#fdecea; border:1px solid #f3b3ac; color:var(--bad); font-size:14px; text-align:center;
  }
</style>
</head>
<body>

<header>
  <h1>📊 ข้อมูลงบการเงินหุ้นไทย (SET)</h1>
  <p>พิมพ์ ticker ของหุ้นในตลาด SET เพื่อดูสถานะหนี้สิน กระแสเงินสด และความสามารถในการทำกำไร</p>
</header>

<div class="search-wrap">
  <input id="tickerInput" type="text" placeholder="เช่น PTT, AOT, CPALL, KBANK ..." autocomplete="off" />
  <button id="searchBtn">ค้นหา</button>
</div>

<main>
  <div id="status"></div>
  <div id="result"></div>
</main>

<footer>
  ข้อมูลจาก Yahoo Finance ผ่าน yfinance · ใช้เพื่อการศึกษาเท่านั้น ไม่ใช่คำแนะนำการลงทุน
</footer>

<script>
const cfg = window.APP_CONFIG;
const sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

const els = {
  input: document.getElementById('tickerInput'),
  btn: document.getElementById('searchBtn'),
  status: document.getElementById('status'),
  result: document.getElementById('result'),
};

let currentTab = 'annual';
let currentRows = [];
let pollTimer = null;

function normalizeTicker(raw){
  let t = (raw || '').trim().toUpperCase();
  if (t && !t.includes('.')) t = t + '.BK';
  return t;
}

function fmtNum(v, opts={}){
  if (v === null || v === undefined || Number.isNaN(v)) return '—';
  const { pct=false, ratio=false, money=true } = opts;
  if (pct) return v.toFixed(2) + '%';
  if (ratio) return v.toFixed(2) + ' เท่า';
  if (money){
    const abs = Math.abs(v);
    if (abs >= 1e9) return (v/1e9).toFixed(2) + ' พันล้าน';
    if (abs >= 1e6) return (v/1e6).toFixed(2) + ' ล้าน';
    return v.toLocaleString('en-US', {maximumFractionDigits:2});
  }
  return v;
}

function colorClass(v, goodIfHigh=true){
  if (v === null || v === undefined) return '';
  if (goodIfHigh) return v >= 0 ? 'good' : 'bad';
  return v <= 1 ? 'good' : 'bad';
}

const METRIC_DEFS = [
  { key:'total_liabilities', label:'หนี้สินรวม', fmt:{money:true} },
  { key:'interest_bearing_debt', label:'หนี้สินที่มีภาระดอกเบี้ย', fmt:{money:true} },
  { key:'de_ratio', label:'หนี้สิน/ทุน (D/E)', fmt:{ratio:true}, badHigh:true },
  { key:'net_debt_to_ebitda', label:'Net Debt / EBITDA', fmt:{ratio:true}, badHigh:true },
  { key:'ebitda', label:'EBITDA', fmt:{money:true}, goodHigh:true },
  { key:'ebit', label:'กำไรก่อนดอกเบี้ย (EBIT)', fmt:{money:true}, goodHigh:true },
  { key:'interest_expense', label:'ดอกเบี้ยจ่าย', fmt:{money:true} },
  { key:'interest_coverage_ratio', label:'Interest Coverage Ratio', fmt:{ratio:true}, goodHigh:true },
  { key:'cfo', label:'กระแสเงินสดจากการดำเนินงาน (CFO)', fmt:{money:true}, goodHigh:true },
  { key:'fcf', label:'Free Cash Flow (FCF)', fmt:{money:true}, goodHigh:true },
  { key:'cash_and_equivalents', label:'เงินสดและรายการเทียบเท่าเงินสด', fmt:{money:true} },
  { key:'current_ratio', label:'Current Ratio', fmt:{ratio:true}, goodHigh:true },
  { key:'net_income', label:'กำไรสุทธิ', fmt:{money:true}, goodHigh:true },
  { key:'roe', label:'ROE', fmt:{pct:true}, goodHigh:true },
  { key:'roa', label:'ROA', fmt:{pct:true}, goodHigh:true },
  { key:'revenue_growth', label:'การเติบโตของรายได้', fmt:{pct:true}, goodHigh:true },
  { key:'earnings_growth', label:'การเติบโตของกำไร', fmt:{pct:true}, goodHigh:true },
];

function renderMetrics(row){
  const cards = METRIC_DEFS.map(def => {
    const v = row[def.key];
    let cls = '';
    if (def.goodHigh) cls = colorClass(v, true);
    if (def.badHigh) cls = colorClass(v, false);
    if (def.key === 'de_ratio') cls = (v!==null && v<=1.5) ? 'good' : (v!==null? 'bad':'');
    if (def.key === 'net_debt_to_ebitda') cls = (v!==null && v<=3) ? 'good' : (v!==null? 'bad':'');
    if (def.key === 'current_ratio') cls = (v!==null && v>=1) ? 'good' : (v!==null? 'bad':'');
    if (def.key === 'interest_coverage_ratio') cls = (v!==null && v>=3) ? 'good' : (v!==null? 'bad':'');
    return `<div class="card">
      <div class="label">${def.label}</div>
      <div class="value ${cls}">${fmtNum(v, def.fmt)}</div>
    </div>`;
  }).join('');
  return `<div class="grid">${cards}</div>`;
}

function tabLabel(row){
  if (!row) return '';
  if (row.period_type === 'annual'){
    // fiscal_label ถูกเก็บเป็นรูปแบบ "FY2025" อยู่แล้ว
    return `ปีบัญชี: ${row.fiscal_label || '-'}`;
  }
  // fiscal_label ของไตรมาสถูกเก็บเป็นรูปแบบ "Q2/2026" อยู่แล้ว
  return `ไตรมาส: ${row.fiscal_label || '-'}`;
}

function renderTabs(){
  const annualRow = currentRows.find(r=>r.period_type==='annual');
  const qRow = currentRows.find(r=>r.period_type==='quarterly');
  return `<div class="tabs">
    ${annualRow? `<button class="tab ${currentTab==='annual'?'active':''}" data-tab="annual">${tabLabel(annualRow)}</button>`:''}
    ${qRow? `<button class="tab ${currentTab==='quarterly'?'active':''}" data-tab="quarterly">${tabLabel(qRow)}</button>`:''}
  </div>`;
}

function renderAll(companyName, ticker){
  const row = currentRows.find(r => r.period_type === currentTab) || currentRows[0];
  if (!row){ els.result.innerHTML=''; return; }
  els.result.innerHTML = `
    <div class="company-header">
      <h2>${companyName || ticker} <span>(${ticker})</span></h2>
      <span class="updated">อัปเดตล่าสุด: ${new Date(row.updated_at).toLocaleString('th-TH')}</span>
    </div>
    ${renderTabs()}
    ${renderMetrics(row)}
  `;
  document.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentTab = btn.dataset.tab; renderAll(companyName, ticker); });
  });
}

async function search(){
  const raw = els.input.value;
  const ticker = normalizeTicker(raw);
  if (!ticker || ticker.length < 4){
    els.status.innerHTML = '<div class="error-box">กรุณาพิมพ์ชื่อหุ้นก่อนค้นหา</div>';
    return;
  }
  clearTimeout(pollTimer);
  els.btn.disabled = true;
  els.result.innerHTML = '';
  els.status.innerHTML = `<span class="spinner"></span> กำลังค้นหา ${ticker} ...`;

  const { data, error } = await sb.from('financials').select('*').eq('ticker', ticker);

  if (error){
    els.status.innerHTML = `<div class="error-box">เกิดข้อผิดพลาด: ${error.message}</div>`;
    els.btn.disabled = false;
    return;
  }

  if (data && data.length > 0){
    currentRows = data;
    currentTab = data.some(r=>r.period_type==='annual') ? 'annual' : 'quarterly';
    els.status.innerHTML = '';
    renderAll(data[0].company_name, ticker);
    els.btn.disabled = false;
    return;
  }

  // ไม่พบข้อมูล -> สั่งให้ระบบไปดึงข้อมูลทันที แล้วรอผล
  els.status.innerHTML = `<span class="spinner"></span> ยังไม่มีข้อมูลของ ${ticker} กำลังสั่งดึงข้อมูลใหม่ (ใช้เวลาประมาณ 1-2 นาที) ...`;
  try{
    await fetch(cfg.TRIGGER_FUNCTION_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization': `Bearer ${cfg.SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ ticker })
    });
  }catch(e){ /* จะลอง poll ต่อแม้ trigger จะ error เผื่อ workflow ถูกรันจากที่อื่นไปแล้ว */ }

  pollForResult(ticker, 0);
}

async function pollForResult(ticker, attempt){
  if (attempt > 24){ // ~2 นาที (24 x 5 วิ)
    els.status.innerHTML = `<div class="error-box">ยังดึงข้อมูลไม่สำเร็จภายในเวลาที่กำหนด ลองกดค้นหาอีกครั้งในอีกสักครู่ หรือตรวจสอบว่าพิมพ์ ticker ถูกต้องหรือไม่</div>`;
    els.btn.disabled = false;
    return;
  }
  const { data } = await sb.from('financials').select('*').eq('ticker', ticker);
  if (data && data.length > 0){
    currentRows = data;
    currentTab = data.some(r=>r.period_type==='annual') ? 'annual' : 'quarterly';
    els.status.innerHTML = '';
    renderAll(data[0].company_name, ticker);
    els.btn.disabled = false;
    return;
  }
  pollTimer = setTimeout(()=>pollForResult(ticker, attempt+1), 5000);
}

els.btn.addEventListener('click', search);
els.input.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ข้อมูลงบการเงินหุ้นไทย (SET)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{
    --bg:#faf5ea; --panel:#ffffff; --border:#e9dfc8;
    --text:#3c2c1e; --muted:#8a7358;
    --brown-dark:#4a2f22; --brown-mid:#6e4430;
    --gold:#d1a02c; --gold-light:#f3c93a; --gold-bg:#fff2c2;
    --good:#2e7d46; --bad:#c0392b; --warn:#c9821f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Prompt',sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh;
  }
  header{
    padding:34px 20px 26px; text-align:center;
    background:linear-gradient(135deg,var(--brown-dark),var(--brown-mid) 60%, #8a5a3a);
    box-shadow:0 4px 18px rgba(74,47,34,0.25);
  }
  header h1{margin:0 0 6px; font-size:23px; font-weight:700; color:#fff;}
  header p{margin:0; color:#e8d9c2; font-size:13px;}
  .search-wrap{
    max-width:520px; margin:-22px auto 0; padding:0 16px; display:flex; gap:8px; position:relative; z-index:2;
  }
  #tickerInput{
    flex:1; padding:15px 18px; border-radius:12px; border:1px solid var(--border);
    background:var(--panel); color:var(--text); font-size:16px; font-family:inherit;
    outline:none; box-shadow:0 6px 16px rgba(74,47,34,0.15);
  }
  #tickerInput:focus{border-color:var(--gold);}
  #searchBtn{
    padding:15px 22px; border-radius:12px; border:none;
    background:linear-gradient(135deg,var(--gold-light),var(--gold));
    color:#4a2f16; font-weight:700; font-size:15px; cursor:pointer;
    box-shadow:0 6px 16px rgba(209,160,44,0.35);
  }
  #searchBtn:disabled{opacity:.6; cursor:default;}
  main{max-width:600px; margin:0 auto; padding:32px 16px 60px;}
  #status{text-align:center; color:var(--muted); font-size:14px; margin:24px 0; min-height:20px;}
  .spinner{
    width:22px; height:22px; border:3px solid var(--border); border-top-color:var(--gold);
    border-radius:50%; display:inline-block; vertical-align:middle; margin-right:8px;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .company-header{
    margin:8px 0 6px; background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:18px 22px; box-shadow:0 3px 10px rgba(74,47,34,0.06);
  }
  .company-header h2{margin:0; font-size:21px; color:var(--brown-dark);}
  .company-header h2 span{color:var(--muted); font-weight:400; font-size:15px;}
  .company-header .updated{color:var(--muted); font-size:12px; margin-top:4px; display:block;}
  .tabs{display:flex; gap:8px; margin:18px 0 6px; flex-wrap:wrap;}
  .tab{
    padding:10px 16px; border-radius:10px; background:var(--panel); border:1px solid var(--border);
    color:var(--brown-mid); cursor:pointer; font-size:13.5px; font-family:inherit; font-weight:500;
  }
  .tab.active{
    background:linear-gradient(135deg,var(--gold-light),var(--gold));
    color:#4a2f16; border-color:var(--gold); font-weight:700;
  }
  .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:14px; margin-top:14px;}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px 18px;
    box-shadow:0 3px 10px rgba(74,47,34,0.05);
  }
  .card .label{font-size:12.5px; color:var(--muted); margin-bottom:8px; font-weight:500;}
  .card .value{font-size:20px; font-weight:700; color:var(--brown-dark);}
  .card .value.good{color:var(--good);}
  .card .value.bad{color:var(--bad);}
  footer{text-align:center; color:var(--muted); font-size:12px; padding:26px 20px; border-top:1px solid var(--border); margin-top:20px;}
  .error-box{
    max-width:520px; margin:20px auto; padding:14px 16px; border-radius:10px;
    background:#fdecea; border:1px solid #f3b3ac; color:var(--bad); font-size:14px; text-align:center;
  }

  /* ---------- Risk Score page ---------- */
  .risk-gauge-wrap{ text-align:center; padding:20px 0 6px; }
  .risk-gauge{ width:190px; height:190px; margin:0 auto; position:relative; }
  .risk-gauge svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .risk-gauge-num{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .risk-gauge-num .score{ font-size:42px; font-weight:800; color:var(--brown-dark); line-height:1; }
  .risk-gauge-num .outof{ font-size:12px; color:var(--muted); margin-top:2px; }
  .risk-level{
    display:inline-block; margin-top:10px; padding:6px 18px; border-radius:20px; font-weight:700; font-size:14px;
  }
  .risk-level.low{ background:#e5f5ea; color:var(--good); }
  .risk-level.mid{ background:#fdf1de; color:var(--warn); }
  .risk-level.high{ background:#fdeceb; color:var(--bad); }

  .risk-cat{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px 18px;
    margin-top:14px; box-shadow:0 3px 10px rgba(74,47,34,0.05);
  }
  .risk-cat-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .risk-cat-head .name{ font-weight:700; font-size:15px; color:var(--brown-dark); }
  .risk-cat-head .weight{ font-size:12px; color:var(--muted); }
  .risk-cat-score{ font-size:13px; font-weight:700; color:var(--brown-mid); margin-bottom:8px; }
  .risk-bar-track{ background:#f0e9d8; border-radius:8px; height:9px; overflow:hidden; margin-bottom:12px; }
  .risk-bar-fill{ height:100%; border-radius:8px; background:linear-gradient(90deg,var(--gold-light),var(--gold)); }
  .risk-item{
    display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-top:1px dashed var(--border);
  }
  .risk-item:first-of-type{ border-top:none; }
  .risk-item .ri-left{ flex:1; }
  .risk-item .ri-name{ font-size:13.5px; font-weight:600; color:var(--text); }
  .risk-item .ri-desc{ font-size:12px; color:var(--muted); margin-top:2px; line-height:1.5; }
  .risk-item .ri-val{ font-size:14px; font-weight:700; white-space:nowrap; padding-top:1px; }
  .ri-val.good{ color:var(--good); }
  .ri-val.bad{ color:var(--bad); }
  .ri-val.neutral{ color:var(--brown-mid); }
  .risk-disclaimer{
    font-size:11.5px; color:var(--muted); text-align:center; margin-top:16px; line-height:1.6; padding:0 8px;
  }
</style>
</head>
<body>

<header>
  <h1>📊 ข้อมูลงบการเงินหุ้นไทย (SET)</h1>
  <p>พิมพ์ ticker ของหุ้นในตลาด SET เพื่อดูสถานะหนี้สิน กระแสเงินสด และความสามารถในการทำกำไร</p>
</header>

<div class="search-wrap">
  <input id="tickerInput" type="text" placeholder="เช่น PTT, AOT, CPALL, KBANK ..." autocomplete="off" />
  <button id="searchBtn">ค้นหา</button>
</div>

<main>
  <div id="status"></div>
  <div id="result"></div>
</main>

<footer>
  ข้อมูลจาก Yahoo Finance ผ่าน yfinance · ใช้เพื่อการศึกษาเท่านั้น ไม่ใช่คำแนะนำการลงทุน
</footer>

<script>
const cfg = window.APP_CONFIG;
const sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

const els = {
  input: document.getElementById('tickerInput'),
  btn: document.getElementById('searchBtn'),
  status: document.getElementById('status'),
  result: document.getElementById('result'),
};

let currentTab = 'risk';   // หน้า Risk Score เป็นหน้าหลัก (default) เสมอ
let currentRows = [];
let pollTimer = null;

function normalizeTicker(raw){
  let t = (raw || '').trim().toUpperCase();
  if (t && !t.includes('.')) t = t + '.BK';
  return t;
}

function fmtNum(v, opts={}){
  if (v === null || v === undefined || Number.isNaN(v)) return '—';
  const { pct=false, ratio=false, money=true } = opts;
  if (pct) return v.toFixed(2) + '%';
  if (ratio) return v.toFixed(2) + ' เท่า';
  if (money){
    const abs = Math.abs(v);
    if (abs >= 1e9) return (v/1e9).toFixed(2) + ' พันล้าน';
    if (abs >= 1e6) return (v/1e6).toFixed(2) + ' ล้าน';
    return v.toLocaleString('en-US', {maximumFractionDigits:2});
  }
  return v;
}

function colorClass(v, goodIfHigh=true){
  if (v === null || v === undefined) return '';
  if (goodIfHigh) return v >= 0 ? 'good' : 'bad';
  return v <= 1 ? 'good' : 'bad';
}

const METRIC_DEFS = [
  { key:'total_liabilities', label:'หนี้สินรวม', fmt:{money:true} },
  { key:'interest_bearing_debt', label:'หนี้สินที่มีภาระดอกเบี้ย', fmt:{money:true} },
  { key:'de_ratio', label:'หนี้สิน/ทุน (D/E)', fmt:{ratio:true}, badHigh:true },
  { key:'net_debt_to_ebitda', label:'Net Debt / EBITDA', fmt:{ratio:true}, badHigh:true },
  { key:'ebitda', label:'EBITDA', fmt:{money:true}, goodHigh:true },
  { key:'ebit', label:'กำไรก่อนดอกเบี้ย (EBIT)', fmt:{money:true}, goodHigh:true },
  { key:'interest_expense', label:'ดอกเบี้ยจ่าย', fmt:{money:true} },
  { key:'interest_coverage_ratio', label:'Interest Coverage Ratio', fmt:{ratio:true}, goodHigh:true },
  { key:'cfo', label:'กระแสเงินสดจากการดำเนินงาน (CFO)', fmt:{money:true}, goodHigh:true },
  { key:'fcf', label:'Free Cash Flow (FCF)', fmt:{money:true}, goodHigh:true },
  { key:'cash_and_equivalents', label:'เงินสดและรายการเทียบเท่าเงินสด', fmt:{money:true} },
  { key:'current_ratio', label:'Current Ratio', fmt:{ratio:true}, goodHigh:true },
  { key:'net_income', label:'กำไรสุทธิ', fmt:{money:true}, goodHigh:true },
  { key:'roe', label:'ROE', fmt:{pct:true}, goodHigh:true },
  { key:'roa', label:'ROA', fmt:{pct:true}, goodHigh:true },
  { key:'revenue_growth', label:'การเติบโตของรายได้', fmt:{pct:true}, goodHigh:true },
  { key:'earnings_growth', label:'การเติบโตของกำไร', fmt:{pct:true}, goodHigh:true },
];

function renderMetrics(row){
  const cards = METRIC_DEFS.map(def => {
    const v = row[def.key];
    let cls = '';
    if (def.goodHigh) cls = colorClass(v, true);
    if (def.badHigh) cls = colorClass(v, false);
    if (def.key === 'de_ratio') cls = (v!==null && v<=1.5) ? 'good' : (v!==null? 'bad':'');
    if (def.key === 'net_debt_to_ebitda') cls = (v!==null && v<=3) ? 'good' : (v!==null? 'bad':'');
    if (def.key === 'current_ratio') cls = (v!==null && v>=1) ? 'good' : (v!==null? 'bad':'');
    if (def.key === 'interest_coverage_ratio') cls = (v!==null && v>=3) ? 'good' : (v!==null? 'bad':'');
    return `<div class="card">
      <div class="label">${def.label}</div>
      <div class="value ${cls}">${fmtNum(v, def.fmt)}</div>
    </div>`;
  }).join('');
  return `<div class="grid">${cards}</div>`;
}

function tabLabel(row){
  if (!row) return '';
  if (row.period_type === 'annual') return `ปีบัญชี: ${row.fiscal_label || '-'}`;
  return `ไตรมาส: ${row.fiscal_label || '-'}`;
}

function renderTabs(){
  const annualRow = currentRows.find(r=>r.period_type==='annual');
  const qRow = currentRows.find(r=>r.period_type==='quarterly');
  return `<div class="tabs">
    <button class="tab ${currentTab==='risk'?'active':''}" data-tab="risk">🎯 Risk Score</button>
    ${annualRow? `<button class="tab ${currentTab==='annual'?'active':''}" data-tab="annual">${tabLabel(annualRow)}</button>`:''}
    ${qRow? `<button class="tab ${currentTab==='quarterly'?'active':''}" data-tab="quarterly">${tabLabel(qRow)}</button>`:''}
  </div>`;
}

/* ============== Risk Score ============== */

function riskLevel(score){
  if (score === null || score === undefined) return { cls:'mid', text:'ไม่มีข้อมูลเพียงพอ' };
  if (score >= 70) return { cls:'low', text:'ความเสี่ยงต่ำ' };
  if (score >= 40) return { cls:'mid', text:'ความเสี่ยงปานกลาง' };
  return { cls:'high', text:'ความเสี่ยงสูง' };
}

function gaugeColor(score){
  if (score === null || score === undefined) return '#c9b98a';
  if (score >= 70) return '#2e7d46';
  if (score >= 40) return '#c9821f';
  return '#c0392b';
}

function renderGauge(score){
  const r = 80, c = 2 * Math.PI * r;
  const pct = score === null || score === undefined ? 0 : Math.max(0, Math.min(100, score)) / 100;
  const offset = c * (1 - pct);
  const color = gaugeColor(score);
  return `
  <div class="risk-gauge">
    <svg viewBox="0 0 190 190">
      <circle cx="95" cy="95" r="${r}" fill="none" stroke="#f0e9d8" stroke-width="16"/>
      <circle cx="95" cy="95" r="${r}" fill="none" stroke="${color}" stroke-width="16"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
    </svg>
    <div class="risk-gauge-num">
      <div class="score">${score===null||score===undefined ? '—' : Math.round(score)}</div>
      <div class="outof">จาก 100</div>
    </div>
  </div>`;
}

function trendText(trend, goodDir){
  if (!trend) return { text:'—', cls:'neutral' };
  const map = { up:'เพิ่มขึ้น ▲', down:'ลดลง ▼', flat:'ทรงตัว ▬' };
  const cls = trend === 'flat' ? 'neutral' : (trend === goodDir ? 'good' : 'bad');
  return { text: map[trend] || '—', cls };
}

function valBox(text, cls){
  return `<div class="ri-val ${cls}">${text}</div>`;
}

function buildRiskCategories(row){
  const ibShare = (row.interest_bearing_debt!=null && row.total_liabilities) ? row.interest_bearing_debt/row.total_liabilities : null;
  const debtToAsset = (row.total_liabilities!=null && row.total_assets) ? row.total_liabilities/row.total_assets : null;
  const ebitdaInterest = (row.ebitda!=null && row.interest_expense) ? row.ebitda/row.interest_expense : null;
  const cfoMargin = (row.cfo!=null && row.revenue) ? row.cfo/row.revenue*100 : null;
  const fcfMargin = (row.fcf!=null && row.revenue) ? row.fcf/row.revenue*100 : null;
  const cfoToDebt = (row.cfo!=null && row.interest_bearing_debt) ? row.cfo/row.interest_bearing_debt : null;
  const cashToShortDebt = (row.cash_and_equivalents!=null && row.short_term_debt) ? row.cash_and_equivalents/row.short_term_debt : null;
  const netMargin = (row.net_income!=null && row.revenue) ? row.net_income/row.revenue*100 : null;

  const dTrend = trendText(row.debt_trend, 'down');
  const ieTrend = trendText(row.interest_expense_trend, 'down');
  const fcfTrend = trendText(row.fcf_trend, 'up');
  const crTrend = trendText(row.current_ratio_trend, 'up');
  const npTrend = trendText(row.net_profit_trend, 'up');

  return [
    {
      name:'1. Leverage / ภาระหนี้', weight:30, score: row.risk_leverage,
      items:[
        { name:'D/E', val: fmtNum(row.de_ratio,{ratio:true}), cls: row.de_ratio!=null ? (row.de_ratio<=1.5?'good':'bad') : 'neutral',
          desc:'บริษัทมีหนี้มากเมื่อเทียบกับเงินทุนของเจ้าของ' },
        { name:'Net Debt / EBITDA', val: fmtNum(row.net_debt_to_ebitda,{ratio:true}), cls: row.net_debt_to_ebitda!=null ? (row.net_debt_to_ebitda<=3?'good':'bad') : 'neutral',
          desc:'ต้องใช้กำไรกี่ปีโดยประมาณเพื่อเคลียร์หนี้สุทธิ' },
        { name:'Interest-bearing Debt / Total Debt', val: ibShare!=null? (ibShare*100).toFixed(1)+'%':'—', cls: ibShare!=null?(ibShare<=0.5?'good':'bad'):'neutral',
          desc:'สัดส่วนหนี้ที่ต้องจ่ายดอกเบี้ย' },
        { name:'Total Debt Trend', val: dTrend.text, cls: dTrend.cls,
          desc:'หนี้เพิ่มขึ้นหรือลดลงจากอดีต' },
        { name:'Debt / Asset', val: debtToAsset!=null? (debtToAsset*100).toFixed(1)+'%':'—', cls: debtToAsset!=null?(debtToAsset<=0.5?'good':'bad'):'neutral',
          desc:'สินทรัพย์ของบริษัทถูกใช้หนี้มากแค่ไหน' },
      ]
    },
    {
      name:'2. ความสามารถจ่ายดอกเบี้ย', weight:25, score: row.risk_interest,
      items:[
        { name:'Interest Coverage Ratio', val: fmtNum(row.interest_coverage_ratio,{ratio:true}), cls: row.interest_coverage_ratio!=null?(row.interest_coverage_ratio>=3?'good':'bad'):'neutral',
          desc:'กำไรเพียงพอจ่ายดอกเบี้ยกี่เท่า' },
        { name:'EBITDA / Interest', val: fmtNum(ebitdaInterest,{ratio:true}), cls: ebitdaInterest!=null?(ebitdaInterest>=3?'good':'bad'):'neutral',
          desc:'กระแสกำไรก่อนรายการสำคัญเพียงพอจ่ายดอกเบี้ยแค่ไหน' },
        { name:'EBIT / Interest', val: fmtNum(row.interest_coverage_ratio,{ratio:true}), cls: row.interest_coverage_ratio!=null?(row.interest_coverage_ratio>=3?'good':'bad'):'neutral',
          desc:'กำไรจากการดำเนินงานครอบคลุมดอกเบี้ยกี่เท่า' },
        { name:'Interest Expense Trend', val: ieTrend.text, cls: ieTrend.cls,
          desc:'ภาระดอกเบี้ยเพิ่มขึ้นหรือลดลง' },
      ]
    },
    {
      name:'3. Cash Flow', weight:22, score: row.risk_cashflow,
      items:[
        { name:'CFO', val: fmtNum(row.cfo,{money:true}), cls: row.cfo!=null?(row.cfo>=0?'good':'bad'):'neutral',
          desc:'เงินสดที่ธุรกิจหลักสร้างได้จริง' },
        { name:'FCF', val: fmtNum(row.fcf,{money:true}), cls: row.fcf!=null?(row.fcf>=0?'good':'bad'):'neutral',
          desc:'เงินสดที่เหลือหลังหักเงินลงทุน' },
        { name:'CFO / Debt', val: cfoToDebt!=null? (cfoToDebt*100).toFixed(1)+'%':'—', cls: cfoToDebt!=null?(cfoToDebt>=0.2?'good':'bad'):'neutral',
          desc:'เงินสดจากธุรกิจเพียงพอรองรับหนี้แค่ไหน' },
        { name:'FCF Trend', val: fcfTrend.text, cls: fcfTrend.cls,
          desc:'เงินสดเหลือหลังลงทุนดีขึ้นหรือแย่ลง' },
      ]
    },
    {
      name:'4. Liquidity', weight:10, score: row.risk_liquidity,
      items:[
        { name:'Current Ratio', val: fmtNum(row.current_ratio,{ratio:true}), cls: row.current_ratio!=null?(row.current_ratio>=1?'good':'bad'):'neutral',
          desc:'ความสามารถจ่ายหนี้ระยะสั้น' },
        { name:'Cash / Short-term Debt', val: cashToShortDebt!=null? (cashToShortDebt*100).toFixed(1)+'%':'—', cls: cashToShortDebt!=null?(cashToShortDebt>=0.5?'good':'bad'):'neutral',
          desc:'เงินสดรองรับหนี้ระยะสั้นได้มากแค่ไหน' },
        { name:'Current Assets/Liabilities Trend', val: crTrend.text, cls: crTrend.cls,
          desc:'สภาพคล่องดีขึ้นหรือแย่ลง' },
      ]
    },
    {
      name:'5. Profitability', weight:8, score: row.risk_profitability,
      items:[
        { name:'Net Profit Margin', val: netMargin!=null? netMargin.toFixed(1)+'%':'—', cls: netMargin!=null?(netMargin>=0?'good':'bad'):'neutral',
          desc:'จากรายได้ 100 บาท เหลือกำไรเท่าไร' },
        { name:'ROA', val: fmtNum(row.roa,{pct:true}), cls: row.roa!=null?(row.roa>=0?'good':'bad'):'neutral',
          desc:'ใช้สินทรัพย์สร้างกำไรได้มีประสิทธิภาพแค่ไหน' },
        { name:'ROE', val: fmtNum(row.roe,{pct:true}), cls: row.roe!=null?(row.roe>=0?'good':'bad'):'neutral',
          desc:'เงินทุนของเจ้าของสร้างกำไรได้ดีแค่ไหน' },
        { name:'Net Profit Trend', val: npTrend.text, cls: npTrend.cls,
          desc:'กำไรเพิ่มขึ้นหรือลดลง' },
      ]
    },
    {
      name:'6. Growth', weight:5, score: row.risk_growth,
      items:[
        { name:'Revenue Growth', val: fmtNum(row.revenue_growth,{pct:true}), cls: row.revenue_growth!=null?(row.revenue_growth>=0?'good':'bad'):'neutral',
          desc:'รายได้โตหรือหดตัว' },
        { name:'EBITDA Growth', val: fmtNum(row.ebitda_growth,{pct:true}), cls: row.ebitda_growth!=null?(row.ebitda_growth>=0?'good':'bad'):'neutral',
          desc:'กำลังทำกำไรจากธุรกิจโตหรือหดตัว' },
        { name:'Profit Growth', val: fmtNum(row.earnings_growth,{pct:true}), cls: row.earnings_growth!=null?(row.earnings_growth>=0?'good':'bad'):'neutral',
          desc:'กำไรสุทธิโตหรือหดตัว' },
      ]
    },
  ];
}

function renderRiskScore(row){
  const level = riskLevel(row.risk_score);
  const cats = buildRiskCategories(row);

  const catHtml = cats.map(cat => {
    const scoreVal = cat.score!=null ? Math.round(cat.score) : null;
    const itemsHtml = cat.items.map(it => `
      <div class="risk-item">
        <div class="ri-left">
          <div class="ri-name">${it.name}</div>
          <div class="ri-desc">${it.desc}</div>
        </div>
        ${valBox(it.val, it.cls)}
      </div>
    `).join('');
    return `
      <div class="risk-cat">
        <div class="risk-cat-head">
          <div class="name">${cat.name}</div>
          <div class="weight">น้ำหนัก ${cat.weight}%</div>
        </div>
        <div class="risk-cat-score">คะแนนหมวดนี้: ${scoreVal!=null? scoreVal+'/100' : 'ไม่มีข้อมูลเพียงพอ'}</div>
        <div class="risk-bar-track"><div class="risk-bar-fill" style="width:${scoreVal||0}%"></div></div>
        ${itemsHtml}
      </div>`;
  }).join('');

  return `
    <div class="risk-gauge-wrap">
      ${renderGauge(row.risk_score)}
      <div><span class="risk-level ${level.cls}">${level.text}</span></div>
    </div>
    ${catHtml}
    <div class="risk-disclaimer">
      Risk Score คำนวณจากตัวเลขงบการเงินล่าสุดด้วยเกณฑ์อย่างง่าย ใช้เพื่อเปรียบเทียบเบื้องต้นเท่านั้น
      ไม่ใช่การจัดอันดับเครดิตอย่างเป็นทางการ และไม่ใช่คำแนะนำการลงทุน
    </div>
  `;
}

/* ============== หน้าหลัก ============== */

function renderAll(companyName, ticker){
  let bodyHtml = '';
  if (currentTab === 'risk'){
    const row = currentRows.find(r=>r.period_type==='annual') || currentRows[0];
    bodyHtml = renderRiskScore(row);
  } else {
    const row = currentRows.find(r => r.period_type === currentTab) || currentRows[0];
    bodyHtml = renderMetrics(row);
  }

  const anyRow = currentRows[0];
  els.result.innerHTML = `
    <div class="company-header">
      <h2>${companyName || ticker} <span>(${ticker})</span></h2>
      <span class="updated">อัปเดตล่าสุด: ${new Date(anyRow.updated_at).toLocaleString('th-TH')}</span>
    </div>
    ${renderTabs()}
    ${bodyHtml}
  `;
  document.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentTab = btn.dataset.tab; renderAll(companyName, ticker); });
  });
}

async function search(){
  const raw = els.input.value;
  const ticker = normalizeTicker(raw);
  if (!ticker || ticker.length < 4){
    els.status.innerHTML = '<div class="error-box">กรุณาพิมพ์ชื่อหุ้นก่อนค้นหา</div>';
    return;
  }
  clearTimeout(pollTimer);
  currentTab = 'risk';
  els.btn.disabled = true;
  els.result.innerHTML = '';
  els.status.innerHTML = `<span class="spinner"></span> กำลังค้นหา ${ticker} ...`;

  const { data, error } = await sb.from('financials').select('*').eq('ticker', ticker);

  if (error){
    els.status.innerHTML = `<div class="error-box">เกิดข้อผิดพลาด: ${error.message}</div>`;
    els.btn.disabled = false;
    return;
  }

  if (data && data.length > 0){
    currentRows = data;
    els.status.innerHTML = '';
    renderAll(data[0].company_name, ticker);
    els.btn.disabled = false;
    return;
  }

  els.status.innerHTML = `<span class="spinner"></span> ยังไม่มีข้อมูลของ ${ticker} กำลังสั่งดึงข้อมูลใหม่ (ใช้เวลาประมาณ 1-2 นาที) ...`;
  try{
    await fetch(cfg.TRIGGER_FUNCTION_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization': `Bearer ${cfg.SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ ticker })
    });
  }catch(e){ /* จะลอง poll ต่อแม้ trigger จะ error เผื่อ workflow ถูกรันจากที่อื่นไปแล้ว */ }

  pollForResult(ticker, 0);
}

async function pollForResult(ticker, attempt){
  if (attempt > 24){
    els.status.innerHTML = `<div class="error-box">ยังดึงข้อมูลไม่สำเร็จภายในเวลาที่กำหนด ลองกดค้นหาอีกครั้งในอีกสักครู่ หรือตรวจสอบว่าพิมพ์ ticker ถูกต้องหรือไม่</div>`;
    els.btn.disabled = false;
    return;
  }
  const { data } = await sb.from('financials').select('*').eq('ticker', ticker);
  if (data && data.length > 0){
    currentRows = data;
    els.status.innerHTML = '';
    renderAll(data[0].company_name, ticker);
    els.btn.disabled = false;
    return;
  }
  pollTimer = setTimeout(()=>pollForResult(ticker, attempt+1), 5000);
}

els.btn.addEventListener('click', search);
els.input.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
</script>
